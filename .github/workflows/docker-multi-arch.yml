name: Publish Docker images

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*"]

jobs:
  release:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/crypto-db
          flavor: |
            suffix=${{ matrix.tag }},onlatest=true
          tags: |
            type=edge,branch=dev,suffix=-dev
            type=edge,branch=main,suffix=${{ matrix.tag }}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: docker/metadata-action@v5
        id: meta-rust
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/crypto-db
          flavor: |
            prefix=rust-,onlatest=true
          tags: |
            type=edge,branch=dev,suffix=-dev
            type=edge,branch=main
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile_rust
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-rust.outputs.tags }}
          labels: ${{ steps.meta-rust.outputs.labels }}
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ secrets.DOCKER_USERNAME }}/crypto-db
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./DOCKER_README.md
